# The maps of the showcase and of maps/, drawn on GitHub Pages, so that the README can link to them:
# a visitor sees them without installing anything. Needs Settings > Pages > Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node skills/maps/serve.mjs showcase --page maps.html --out site
          node skills/maps/serve.mjs maps --page maps.html --out site
          mv site/showcase-maps.html site/showcase.html
          mv site/*-maps.html site/maps.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
