# Checks each push to main and each pull request, on Linux and Windows, and on macOS only on main (its runners can keep
# a pull request waiting for minutes): the types of the code hold (TypeScript, strict), the generated files are in step
# with renderer/, the drawings and the maps of the showcase pass (robustness).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        # What people run, on the other systems: the minimum version of Node is enough.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"windows-latest","node":22},{"os":"macos-latest","node":22}]' || '[{"os":"windows-latest","node":22}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run build
      - run: git diff --exit-code
      - run: npm test
      # The examples of the showcase, each a project of its own, with its own types.
      - run: node skills/maps/check.mjs showcase
      - run: git diff --exit-code # the header comments, written by the check, are up to date
